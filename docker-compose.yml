services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ch_fuel
      POSTGRES_PASSWORD: ch_fuel
      POSTGRES_DB: ch_fuel_planner
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18+ images keep PGDATA at /var/lib/postgresql/18/docker and
      # refuse a mount at the old /var/lib/postgresql/data. db-data-18 is a new
      # volume because 18 cannot open a 16 data directory; the old `db-data`
      # volume (Postgres 16) is left in place, unreferenced, as a fallback.
      - db-data-18:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it pg_isready uses the unix
      # socket, which the entrypoint's temporary init server also answers — so
      # on a fresh volume the container reports healthy, `up --wait` returns,
      # and db:migrate connects just as that temp server shuts down. The temp
      # server runs with listen_addresses='', so TCP is only accepted once the
      # real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ch_fuel -d ch_fuel_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data-18:
